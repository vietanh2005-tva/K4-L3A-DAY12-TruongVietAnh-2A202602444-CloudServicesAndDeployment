name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test checkpoints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        env:
          AGENT_API_KEY: ci-dummy-key
          REDIS_URL: "fake://"
        run: >-
          python -m pytest
          tests/test_cp1.py
          tests/test_cp2.py
          tests/test_cp3.py
          tests/test_cp4.py
          -m "not docker"
          -v

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag day12-agent:${{ github.sha }} .

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Smoke test deployed service
        env:
          PUBLIC_URL: https://day12-agent-dn9e.onrender.com
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$PUBLIC_URL/health"; then
              exit 0
            fi
            echo "Waiting for deployment ($attempt/30)..."
            sleep 10
          done
          exit 1
